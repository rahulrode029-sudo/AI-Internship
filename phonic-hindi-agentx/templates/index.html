<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hindi Voice Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: #111827;
        }


        .container {

            width:
                min(
                    720px,
                    92%
                );

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );
        }


        h1 {

            text-align: center;

            margin:
                0 0 10px 0;

            font-size: 32px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        .status {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;

            font-weight: bold;
        }


        .status-dot {

            width: 13px;

            height: 13px;

            border-radius: 50%;

            background: #9ca3af;
        }


        .status-dot.connected {

            background: #22c55e;

            box-shadow:
                0 0 12px
                rgba(
                    34,
                    197,
                    94,
                    0.7
                );
        }


        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-bottom: 30px;
        }


        button {

            border: none;

            border-radius: 12px;

            padding:
                14px 25px;

            font-size: 16px;

            cursor: pointer;
        }


        #startButton {

            background: #111827;

            color: white;
        }


        #stopButton {

            background: #e5e7eb;

            color: #111827;
        }


        button:disabled {

            opacity: 0.45;

            cursor:
                not-allowed;
        }


        .conversation {

            margin-top: 10px;
        }


        .conversation-title {

            font-weight: bold;

            margin-bottom: 10px;
        }


        #conversation {

            min-height: 100px;

            max-height: 220px;

            overflow-y: auto;

            border:
                1px solid #e5e7eb;

            border-radius: 12px;

            padding: 15px;

            background: #f9fafb;

            white-space: pre-wrap;
        }


        .log-title {

            margin-top: 25px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        #log {

            width: 100%;

            height: 180px;

            background: #111827;

            color: #e5e7eb;

            border-radius: 12px;

            padding: 15px;

            overflow-y: auto;

            white-space: pre-wrap;

            font-family:
                Consolas,
                monospace;

            font-size: 12px;
        }

    </style>

</head>


<body>

    <main class="container">

        <h1>
            Hindi Voice Assistant
        </h1>

        <div class="subtitle">
            Hindi / Hinglish real-time conversation
        </div>


        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                Disconnected
            </span>

        </div>


        <div class="buttons">

            <button
                id="startButton"
            >
                Start Conversation
            </button>


            <button
                id="stopButton"
                disabled
            >
                Stop
            </button>

        </div>


        <div class="conversation">

            <div class="conversation-title">
                Conversation
            </div>

            <div id="conversation">
                Press "Start Conversation" and speak Hindi.
            </div>

        </div>


        <div class="log-title">
            System Log
        </div>

        <pre id="log"></pre>

    </main>


    <script src="/static/audio.js"></script>

    <script src="/static/app.js"></script>

</body>

</html>
